name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Signing Keystore & Properties
        run: |
          keytool -genkeypair -v -keystore android/app/auto_keystore.jks -storepass password123 -alias auto_key -keypass password123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Developer, OU=Dev, O=Dev, L=City, S=State, C=US"
          cat <<EOF > android/key.properties
          storePassword=password123
          keyPassword=password123
          keyAlias=auto_key
          storeFile=auto_keystore.jks
          EOF

      - name: Setup Gradle 8 Wrapper
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle Wrapper
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Prepare APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/app-release.apk \;

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeacherConnect-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
