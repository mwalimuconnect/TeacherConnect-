name: Unzip and Build Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o Teacher-Connect-7.zip -d extracted_temp
          PROJECT_ROOT=$(find extracted_temp -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found pubspec.yaml at $PROJECT_ROOT"
          cp -r $PROJECT_ROOT/* .
          rm -rf extracted_temp

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Standalone Profile APK
        run: flutter build apk --profile

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeacherConnect-Standalone-APK
          path: build/app/outputs/flutter-apk/app-profile.apk
